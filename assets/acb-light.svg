<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="231" viewBox="0 0 1080 231" role="img" aria-labelledby="title">
<title id="title">Agent Circuit Breaker: a proposed action reaches a policy check before a decision. Should this action execute?</title>
